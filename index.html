<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony Ameen Dyer</title>
    <meta name="description" content="In memory of Anthony Ameen Dyer, December 8, 1969 &ndash; May 5, 2026.">

    <meta property="og:title" content="Anthony Ameen Dyer">
    <meta property="og:description" content="December 8, 1969 &ndash; May 5, 2026">
    <meta property="og:type" content="website">
    <meta property="og:image" content="tony.jpg">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke-width='3.6' stroke-linecap='round' fill='none'%3E%3Cpath d='M3 9C7 4.5 11.5 4.5 16 9C20.5 13.5 25 13.5 29 9' stroke='%2387bfc1'/%3E%3Cpath d='M3 16C7 11.5 11.5 11.5 16 16C20.5 20.5 25 20.5 29 16' stroke='%2347a2b0'/%3E%3Cpath d='M3 23C7 18.5 11.5 18.5 16 23C20.5 27.5 25 27.5 29 23' stroke='%2347a2b0'/%3E%3C/g%3E%3C/svg%3E">
    <style>
      :root {
        /* Sampled from the water just outside the shore break in Tony's photo:
           #47a2b0 deeper, #87bfc1 sandy turquoise, #9ac9c9 where sand lightens
           it. Deeper up top, paling toward the bottom, as water does to shore. */
        --bg-top: #6fb3bb;
        --bg-bottom: #a9d1d0;
        --ink: #204e57;
        --shadow: 18, 66, 74;
        --card: #f9f7f1;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        min-height: 100vh;
        min-height: 100dvh; /* accounts for mobile browser chrome */
        padding: 2.5rem 1.25rem;
        /* An abstract shore break: a band of denser foam thinning to nothing
           above and below, repeating horizontally only. It sits behind the
           card, so the texture reads around the photo, never over it. */
        background-image: url('foam.png'),
                          linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
        background-repeat: repeat-x, no-repeat;
        background-position: center 72%, center;
        color: var(--ink);
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        max-width: min(440px, 100%);
        padding: 1.5rem 1.5rem 1.75rem;
        background: var(--card);
        border-radius: 4px;
        box-shadow:
          0 1px 2px rgba(var(--shadow), 0.12),
          0 18px 48px rgba(var(--shadow), 0.28);
        text-align: center;
        animation: rise 1.4s ease-out both;
      }

      .photo {
        display: block;
        /* Sized to the image itself, not to the card - a fixed width plus a
           max-height would letterbox the portrait inside its own border. */
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: min(52vh, 540px);
        margin: 0 auto;
        border: 1px solid rgba(var(--shadow), 0.28);
      }

      .name {
        margin: 1.25rem 0 0;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 1.4rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: #333;
      }

      .dates {
        margin: 0.4rem 0 0;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 0.9375rem;
        color: #555;
      }

      .rule {
        /* 56% of the card, as it was drawn in the original card art. */
        width: 56%;
        margin: 1.1rem auto 0;
        border: 0;
        border-top: 1px solid rgba(var(--shadow), 0.22);
      }

      .epitaph {
        margin: 1rem 0 0;
        font-size: 0.875rem;
        font-style: italic;
        line-height: 1.6;
        color: #4d4d47;
      }

      /* A hermit crab down on the sand, out in the gutter beside the card
         with its feet on the card's bottom edge. It lives inside .card so
         that bottom:0 tracks that edge however the content reflows. */
      .crab {
        position: absolute;
        bottom: 0;
        left: 100%;
        margin-left: clamp(0.5rem, 1.6vw, 1.75rem);
        /* A fixed share of the card, not of the viewport, so he keeps the
           same proportion to it at every screen size. */
        width: 10.3%;
        height: auto;
        opacity: 0.92;
        cursor: pointer;
        animation: rise 1.4s ease-out 0.6s both;
      }

      /* Legs and claws pivot where they meet the body. The scuttle only runs
         while he is actually moving; alternating legs are offset half a cycle
         so the gait reads as a gait and not a shiver. */
      .crab .leg,
      .crab .claw { transform-box: view-box; }

      /* He is the play button, so he has to be reachable by keyboard too.
         The ring is drawn around the carapace rather than the SVG box, which
         is mostly empty air. */
      .crab:focus-visible { outline: none; }
      .crab:focus-visible .body {
        stroke: var(--ink);
        stroke-width: 2.4;
      }

      .crab.walking .leg { animation: scuttle 0.30s ease-in-out infinite alternate; }
      .crab.walking .claw { animation: brandish 0.60s ease-in-out infinite alternate; }
      .crab.walking .l1l,
      .crab.walking .l3l,
      .crab.walking .l2r { animation-delay: -0.15s; }
      .crab.walking .cr { animation-delay: -0.30s; }

      @keyframes scuttle {
        from { transform: rotate(-10deg); }
        to   { transform: rotate(10deg); }
      }

      @keyframes brandish {
        from { transform: rotate(-6deg); }
        to   { transform: rotate(6deg); }
      }

      /* Below this width the card fills the page and there is no gutter to
         stand in, so the crab steps down under its bottom-right corner. */
      @media (max-width: 620px) {
        /* A little more air under the card, so his run clears the footer. */
        body { gap: 2.5rem; }

        .crab {
          left: 0;
          right: auto;
          bottom: auto;
          top: calc(100% + 0.3rem);   /* clear of the footer's ascenders */
          margin-left: 0;
        }
      }

      .card, footer {
        position: relative;
        z-index: 1;
      }

      footer {
        max-width: 34rem;
        text-align: center;
        line-height: 1.7;
        animation: rise 1.4s ease-out 0.35s both;
      }

      footer p {
        margin: 0;
      }

      .memory {
        font-size: 1.25rem;
        letter-spacing: 0.06em;
        opacity: 0.85;
      }

      /* The crab is the control. This is a second one, because a moving
         45px crab is not something everyone can hit and nobody should have
         to. A speaker icon rather than words: it says the same thing in a
         quarter of the space, and the page has no other prose to match. */
      .music {
        display: block;
        margin: 1.1rem auto 0;
        padding: 0.3rem;
        border: 0;
        background: none;
        color: var(--ink);
        line-height: 0;
        opacity: 0.5;
        cursor: pointer;
        transition: opacity 0.3s ease;
      }

      .music:hover,
      .music:focus-visible { opacity: 0.85; }

      .music-icon { width: 20px; height: 20px; }
      .music-icon .spk { fill: currentColor; }
      .music-icon .waves,
      .music-icon .slash { fill: none; stroke: currentColor; }

      /* Silent shows a cross where the waves would be, playing shows the
         waves. A cross rather than a line struck through the whole glyph:
         both are conventional, but a struck-through line crosses the filled
         speaker body and would need knocking out against a gradient that
         changes down the page. The cross sits in empty space and stays
         legible on any background. The button's aria-pressed drives which
         half shows, so there is one source of truth. */
      .music[aria-pressed="false"] .waves,
      .music[aria-pressed="true"] .slash { display: none; }

      /* A hairline that fills as the recording plays, and is not there at
         all otherwise. Opacity rather than display, so the footer does not
         reflow when it comes and goes. */
      .progress {
        width: min(190px, 55%);
        height: 2px;
        margin: 0.6rem auto 0;
        border-radius: 1px;
        background: rgba(var(--shadow), 0.16);
        overflow: hidden;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      .progress.on { opacity: 1; }

      .progress-fill {
        display: block;
        width: 0;
        height: 100%;
        background: var(--ink);
        opacity: 0.5;
        /* timeupdate only fires a few times a second; this carries the bar
           between ticks so it creeps rather than steps. */
        transition: width 0.25s linear;
      }

      /* The provenance stays out of sight until the music is actually
         playing, at which point it is the only thing worth saying. Opacity
         rather than display, so the line below never jumps. */
      .music-credit {
        margin: 0.3rem 0 0;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 0.6875rem;
        letter-spacing: 0.02em;
        opacity: 0;
        transition: opacity 0.9s ease;
      }

      .music-credit.on { opacity: 0.55; }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .card, footer, .crab, .crab .leg, .crab .claw { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="photo" src="tony.jpg" alt="Anthony Ameen Dyer smiling on a shoreline bluff, an island and turquoise surf behind him.">
      <h1 class="name">Anthony Ameen Dyer</h1>
      <p class="dates">December 8, 1969 &ndash; May 5, 2026</p>
      <hr class="rule">
      <p class="epitaph">A life is measured in the love shared, the laughter remembered, and the lives made better along the way.</p>
      <svg class="crab" viewBox="0 0 64 48" role="button" tabindex="0"
           aria-pressed="false" aria-label="Play music">
        <rect width="64" height="48" fill="transparent"/>
        <g class="leg l1l" style="transform-origin:20.0px 30.0px"><path d="M20.0 30.0Q14.0 30.0 9.0 32.0" fill="none" stroke="#a9765f" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="leg l2l" style="transform-origin:21.0px 33.0px"><path d="M21.0 33.0Q16.0 36.0 11.0 39.0" fill="none" stroke="#a9765f" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="leg l3l" style="transform-origin:24.0px 36.0px"><path d="M24.0 36.0Q21.0 40.0 18.0 44.0" fill="none" stroke="#a9765f" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="leg l1r" style="transform-origin:44.0px 30.0px"><path d="M44.0 30.0Q50.0 30.0 55.0 32.0" fill="none" stroke="#a9765f" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="leg l2r" style="transform-origin:43.0px 33.0px"><path d="M43.0 33.0Q48.0 36.0 53.0 39.0" fill="none" stroke="#a9765f" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="leg l3r" style="transform-origin:40.0px 36.0px"><path d="M40.0 36.0Q43.0 40.0 46.0 44.0" fill="none" stroke="#a9765f" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="claw cl" style="transform-origin:21.0px 25.0px"><path d="M21.0 25.0Q17.0 21.0 13.2 18.2" fill="none" stroke="#a9765f" stroke-width="3.1" stroke-linecap="round"/><path d="M3.0 10.8 L12.5 14.2 C15.8 15.4 15.8 20.6 12.5 21.8 L3.4 23.0 L7.8 17.2 Z" fill="#a9765f" stroke="#a9765f" stroke-width="1.4" stroke-linejoin="round"/></g>
        <g class="claw cr" style="transform-origin:43.0px 25.0px"><path d="M43.0 25.0Q47.0 21.0 50.8 18.2" fill="none" stroke="#a9765f" stroke-width="3.1" stroke-linecap="round"/><path d="M61.0 10.8 L51.5 14.2 C48.2 15.4 48.2 20.6 51.5 21.8 L60.6 23.0 L56.2 17.2 Z" fill="#a9765f" stroke="#a9765f" stroke-width="1.4" stroke-linejoin="round"/></g>
        <g fill="none" stroke="#96685a" stroke-width="1.9" stroke-linecap="round"><path d="M27.5 22L26.5 17.4"/><path d="M36.5 22L37.5 17.4"/></g>
        <ellipse class="body" cx="32" cy="29" rx="14.5" ry="9.8" fill="#b8846f" stroke="#96685a" stroke-width="1.3"/>
        <circle cx="26.4" cy="16" r="2.4" fill="#352c27"/><circle cx="37.6" cy="16" r="2.4" fill="#352c27"/>
      </svg>
    </main>

    <footer>
      <p class="memory">In loving memory</p>
      <button class="music" type="button" aria-pressed="false" aria-label="Play music">
        <svg class="music-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path class="spk" d="M1.8 6h2.7L8 3.1v9.8L4.5 10H1.8z"/>
          <g class="waves" stroke-width="1.35" stroke-linecap="round">
            <path d="M10.4 5.9a3.2 3.2 0 0 1 0 4.2"/>
            <path d="M12.5 4.1a6 6 0 0 1 0 7.8"/>
          </g>
          <g class="slash" stroke-width="1.5" stroke-linecap="round">
            <path d="M10.7 5.9l3.9 3.9"/>
            <path d="M14.6 5.9l-3.9 3.9"/>
          </g>
        </svg>
      </button>
      <div class="progress" aria-hidden="true"><span class="progress-fill"></span></div>
    </footer>

    <!-- preload="none" so a visitor who never asks for music never downloads
         it, and no autoplay attribute anywhere. It plays once rather than
         looping. Sources are tried in order and
         a 404 falls through to the next, so whichever of these exists is the
         one that plays; the m4a is first because it is the smaller file. -->
    <audio class="music-track" preload="none">
      <source src="sound.m4a" type="audio/mp4">
      <source src="sound.mp3" type="audio/mpeg">
    </audio>


    <script>
      /* Background music, off until asked for. The crab is the control and
         the line under the footer is a second one, since a moving 45px crab
         is not a target everyone can hit. Volume is ramped by hand
         at both ends - an abrupt cut is jarring in a quiet room, and volume is
         not a property CSS or the animation API can tween. */
      (function () {
        var btn = document.querySelector('.music');
        var credit = document.querySelector('.music-credit');
        var audio = document.querySelector('.music-track');
        var crab = document.querySelector('.crab');
        var bar = document.querySelector('.progress');
        var fill = document.querySelector('.progress-fill');
        if (!btn || !audio) return;

        var LEVEL = 0.5;   /* a bed under the page, not a performance */
        var playing = false;
        var fade;

        function ramp(to, ms, done) {
          clearInterval(fade);
          var from = audio.volume, t0 = Date.now();
          fade = setInterval(function () {
            var k = Math.min(1, (Date.now() - t0) / ms);
            audio.volume = from + (to - from) * k;
            if (k === 1) { clearInterval(fade); if (done) done(); }
          }, 40);
        }

        /* Every control and label reads off `playing`, so the ended handler
           can put things back simply by clearing it and calling this. */
        function render() {
          btn.setAttribute('aria-pressed', playing ? 'true' : 'false');
          if (crab) {
            crab.setAttribute('aria-pressed', playing ? 'true' : 'false');
            crab.setAttribute('aria-label',
              playing ? 'Pause music' : 'Play music');
          }
          btn.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
          if (credit) credit.classList.toggle('on', playing);
          if (bar) bar.classList.toggle('on', playing);
        }

        /* Duration is NaN until metadata arrives, and preload is none, so it
           is genuinely absent until the first play. */
        audio.addEventListener('timeupdate', function () {
          if (!fill || !playing) return;
          var d = audio.duration;
          if (!d || d !== d) return;
          fill.style.width = Math.min(100, (audio.currentTime / d) * 100) + '%';
        });

        function toggle() {
          playing = !playing;
          render();
          if (!playing) { ramp(0, 900, function () { audio.pause(); }); return; }
          audio.volume = 0;
          var started = audio.play();
          ramp(LEVEL, 2000);
          if (started && started.catch) started.catch(fail);
        }

        /* Playback can stop without our asking: the recording runs out, or
           the browser interrupts it. Either way the control has to come back
           to offering it rather than sitting there showing sound.

           render() runs BEFORE the rewind. Seeking an element that has just
           ended throws in some browsers, and when it did, the throw took the
           icon update down with it - the state said stopped and the speaker
           still showed waves. The seek is now last and guarded, so it cannot
           take anything with it if it fails.

           Guarding on `playing` keeps our own fade-out from tripping this:
           there the flag is already false, so it returns before touching
           anything and the paused position is kept. */
        function stopped(rewind) {
          clearInterval(fade);
          if (!playing) return;
          playing = false;
          render();
          if (rewind) {
            try { audio.currentTime = 0; } catch (e) {}
            if (fill) fill.style.width = '0';   /* masked by the bar fading out */
          }
        }
        audio.addEventListener('ended', function () { stopped(true); });
        audio.addEventListener('pause', function () { stopped(false); });

        btn.addEventListener('click', toggle);

        if (crab) {
          crab.addEventListener('click', toggle);
          /* Space and Enter, as a real button would. Space also scrolls the
             page unless that is taken off it. */
          crab.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
              e.preventDefault();
              toggle();
            }
          });

          /* Hold him still while someone is reaching for him, and let him go
             when they leave. Without this he is a target that runs away. */
          function hold(on) {
            if (on) { crab.dataset.hold = '1'; } else { delete crab.dataset.hold; }
            crab.getAnimations().forEach(function (a) {
              if (on) { a.pause(); } else if (a.playState === 'paused') { a.play(); }
            });
          }
          crab.addEventListener('mouseenter', function () { hold(true); });
          crab.addEventListener('mouseleave', function () { hold(false); });
          crab.addEventListener('focus', function () { hold(true); });
          crab.addEventListener('blur', function () { hold(false); });
        }

        /* A file that will not play should leave no dead control behind. */
        function fail() {
          clearInterval(fade);
          playing = false;
          btn.remove();
          if (credit) credit.remove();
          if (crab) {
            crab.removeAttribute('role');
            crab.removeAttribute('tabindex');
            crab.removeAttribute('aria-pressed');
            crab.setAttribute('aria-hidden', 'true');
            crab.style.cursor = '';
          }
        }
        audio.addEventListener('error', fail);
      })();

      /* The crab scurries out into the gutter and back. Every third or fourth
         lap - picked fresh each time - it throws in a backflip. Script-driven
         because "a random lap" is not something CSS keyframes can say. */
      (function () {
        var crab = document.querySelector('.crab');
        var card = document.querySelector('.card');
        if (!crab || !card || !crab.animate) return;

        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
        var running = false;

        /* Untransformed geometry. Note an SVG element has no offsetLeft or
           offsetWidth - those are HTMLElement properties - and a bounding rect
           would include the transform we are mid-way through applying. So the
           resting box is derived from computed style against the card. */
        function metrics() {
          var cr = card.getBoundingClientRect(), cs = getComputedStyle(crab);
          var w = parseFloat(cs.width) || 0, h = parseFloat(cs.height) || 0;
          var left = cs.left !== 'auto'
            ? cr.left + (parseFloat(cs.left) || 0) + (parseFloat(cs.marginLeft) || 0)
            : cr.right - (parseFloat(cs.right) || 0) - w;
          return { left: left, w: w, h: h };
        }
        /* Beside the card he runs out towards the window edge; below it he has
           the full width of the card to range across. */
        function runway(m) {
          var below = window.matchMedia('(max-width: 620px)').matches;
          var limit = below ? card.getBoundingClientRect().right : window.innerWidth - 12;
          return Math.max(0, limit - m.left - m.w);
        }
        function rnd(a, b) { return a + Math.random() * (b - a); }
        function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
        function tf(x, y, dir, rot) {
          return 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)'
               + ' rotate(' + rot.toFixed(1) + 'deg) scaleX(' + dir + ')';
        }
        function play(frames, ms, easing) {
          var a = crab.animate(frames, {
            duration: ms, easing: easing || 'ease-in-out', fill: 'forwards'
          });
          /* Held the moment it is created, so a lap that begins while the
             pointer is already on him does not run out from under it. */
          if (crab.dataset.hold) a.pause();
          return a.finished.catch(function () {});
        }
        /* Turning has to be instant - tweening scaleX would squash it through zero. */
        function face(x, dir) {
          return play([{ transform: tf(x, 0, dir, 0) }, { transform: tf(x, 0, dir, 0) }], 1);
        }

        async function loop() {
          /* He always faces left, as drawn - he never turns round. So the run
             out to the right is travelled backwards, and the run home is
             forwards. Every backward run carries a flip. */

          async function dash(from, to, bob) {
            var span = to - from;
            crab.classList.add('walking');
            await play([
              { transform: tf(from, 0, 1, 0) },
              { transform: tf(from + span * 0.25, -bob, 1, 0) },
              { transform: tf(from + span * 0.5, 0, 1, 0) },
              { transform: tf(from + span * 0.75, -bob, 1, 0) },
              { transform: tf(to, 0, 1, 0) }
            ], Math.min(4400, Math.max(1600, Math.abs(span) * 12.8)));
            crab.classList.remove('walking');
          }

          async function sideflip(x) {
            var hop = metrics().h * 0.3;   /* just a slight bump off the sand */
            await play([
              { transform: tf(x, 0, 1, 0) },
              { transform: tf(x, -hop, 1, 180), offset: 0.5 },
              { transform: tf(x, 0, 1, 360) }      /* a cartwheel, rolling the way he is going */
            ], 1440, 'cubic-bezier(.34,.01,.53,1)');
            await face(x, 1);                      /* 360deg back to a clean base */
          }

          while (running) {
            if (document.hidden) { await wait(600); continue; }

            var m = metrics(), R = runway(m);
            if (!(R >= 24)) { await wait(1200); continue; }  /* no room to run */
            var bob = m.w * 0.07;

            /* Backwards, out into the gutter. The outward leg breaks at the
               first third, he turns over, then carries on. */
            await dash(0, R / 3, bob);
            await sideflip(R / 3);
            await dash(R / 3, R, bob);
            await wait(rnd(600, 1500));
            if (!running) break;

            await dash(R, 0, bob);                 /* forwards, home again */
            await wait(rnd(600, 1500));
          }
        }

        function start() {
          if (reduce.matches || running) return;
          running = true;
          crab.style.animation = 'none';  /* release the entry animation's hold */
          loop();
        }
        function stop() {
          running = false;
          crab.getAnimations().forEach(function (a) { a.cancel(); });
          crab.style.transform = '';
        }

        reduce.addEventListener('change', function () { reduce.matches ? stop() : start(); });
        setTimeout(start, 2100);          /* let the entry rise settle first */
      })();
    </script>
  </body>
</html>
