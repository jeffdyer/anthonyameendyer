<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony Ameen Dyer</title>
    <meta name="description" content="In memory of Anthony Ameen Dyer, December 8, 1969 &ndash; May 5, 2026.">

    <meta property="og:title" content="Anthony Ameen Dyer">
    <meta property="og:description" content="December 8, 1969 &ndash; May 5, 2026">
    <meta property="og:type" content="website">
    <meta property="og:image" content="tony.jpg">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke-width='3.6' stroke-linecap='round' fill='none'%3E%3Cpath d='M3 9C7 4.5 11.5 4.5 16 9C20.5 13.5 25 13.5 29 9' stroke='%2387bfc1'/%3E%3Cpath d='M3 16C7 11.5 11.5 11.5 16 16C20.5 20.5 25 20.5 29 16' stroke='%2347a2b0'/%3E%3Cpath d='M3 23C7 18.5 11.5 18.5 16 23C20.5 27.5 25 27.5 29 23' stroke='%2347a2b0'/%3E%3C/g%3E%3C/svg%3E">
    <style>
      :root {
        /* Sampled from the water just outside the shore break in Tony's photo:
           #47a2b0 deeper, #87bfc1 sandy turquoise, #9ac9c9 where sand lightens
           it. Deeper up top, paling toward the bottom, as water does to shore. */
        --bg-top: #6fb3bb;
        --bg-bottom: #a9d1d0;
        --ink: #204e57;
        --shadow: 18, 66, 74;
        --card: #f9f7f1;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        min-height: 100vh;
        min-height: 100dvh; /* accounts for mobile browser chrome */
        padding: 2.5rem 1.25rem;
        /* An abstract shore break: a band of denser foam thinning to nothing
           above and below, repeating horizontally only. It sits behind the
           card, so the texture reads around the photo, never over it. */
        background-image: url('foam.png'),
                          linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
        background-repeat: repeat-x, no-repeat;
        background-position: center 72%, center;
        color: var(--ink);
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        max-width: min(440px, 100%);
        padding: 1.5rem 1.5rem 1.75rem;
        background: var(--card);
        border-radius: 4px;
        box-shadow:
          0 1px 2px rgba(var(--shadow), 0.12),
          0 18px 48px rgba(var(--shadow), 0.28);
        text-align: center;
        animation: rise 1.4s ease-out both;
      }

      .photo {
        display: block;
        /* Sized to the image itself, not to the card - a fixed width plus a
           max-height would letterbox the portrait inside its own border. */
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: min(52vh, 540px);
        margin: 0 auto;
        border: 1px solid rgba(var(--shadow), 0.28);
      }

      .name {
        margin: 1.25rem 0 0;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 1.4rem;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: #333;
      }

      .dates {
        margin: 0.4rem 0 0;
        font-family: Helvetica, Arial, sans-serif;
        font-size: 0.9375rem;
        color: #555;
      }

      .rule {
        /* 56% of the card, as it was drawn in the original card art. */
        width: 56%;
        margin: 1.1rem auto 0;
        border: 0;
        border-top: 1px solid rgba(var(--shadow), 0.22);
      }

      .epitaph {
        margin: 1rem 0 0;
        font-size: 0.875rem;
        font-style: italic;
        line-height: 1.6;
        color: #4d4d47;
      }

      /* A hermit crab down on the sand, out in the gutter beside the card
         with its feet on the card's bottom edge. It lives inside .card so
         that bottom:0 tracks that edge however the content reflows. */
      .crab {
        position: absolute;
        bottom: 0;
        left: 100%;
        margin-left: clamp(0.5rem, 1.6vw, 1.75rem);
        width: clamp(23px, 3vw, 48px);
        height: auto;
        opacity: 0.92;
        pointer-events: none;
        animation: rise 1.4s ease-out 0.6s both;
      }

      /* Below this width the card fills the page and there is no gutter to
         stand in, so the crab steps down under its bottom-right corner. */
      @media (max-width: 620px) {
        .crab {
          left: auto;
          right: 0;
          bottom: auto;
          top: calc(100% + 0.6rem);
          margin-left: 0;
        }
      }

      .card, footer {
        position: relative;
        z-index: 1;
      }

      footer {
        max-width: 34rem;
        text-align: center;
        line-height: 1.7;
        animation: rise 1.4s ease-out 0.35s both;
      }

      footer p {
        margin: 0;
      }

      .memory {
        font-size: 1.25rem;
        letter-spacing: 0.06em;
        opacity: 0.85;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .card, footer, .crab { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="photo" src="tony.jpg" alt="Anthony Ameen Dyer smiling on a shoreline bluff, an island and turquoise surf behind him.">
      <h1 class="name">Anthony Ameen Dyer</h1>
      <p class="dates">December 8, 1969 &ndash; May 5, 2026</p>
      <hr class="rule">
      <p class="epitaph">A life is measured in the love shared, the laughter remembered, and the lives made better along the way.</p>
      <svg class="crab" viewBox="0 0 64 48" aria-hidden="true" focusable="false">
        <g fill="none" stroke="#b35a3e" stroke-linecap="round">
          <g stroke-width="2.8">
            <path d="M36 32C31 35 27 37 22 38"/>
            <path d="M38 34C35 38 32 41 28 43"/>
            <path d="M41 35C40 39 39 42 37 45"/>
          </g>
          <g stroke-width="3">
            <path d="M32 29C25 30 20 31 16 32"/>
            <path d="M31 22C25 20 20 19 16 19"/>
          </g>
          <g stroke-width="2.2">
            <path d="M32 25L24 16"/><path d="M34 23L29 13"/>
          </g>
        </g>
        <!-- big claw (lower): stubby palm plus two short prongs -->
        <ellipse cx="13" cy="32" rx="5" ry="4" fill="#cf7455"/>
        <g stroke="#cf7455" stroke-width="3.4" stroke-linecap="round">
          <path d="M11 30.2L6.5 28.6"/><path d="M11 33.8L6.8 35.6"/>
        </g>
        <!-- small claw (upper) -->
        <ellipse cx="14" cy="19" rx="3.6" ry="2.9" fill="#cf7455"/>
        <g stroke="#cf7455" stroke-width="2.6" stroke-linecap="round">
          <path d="M12.6 17.8L9.4 16.6"/><path d="M12.6 20.2L9.6 21.6"/>
        </g>
        <circle cx="23.2" cy="15" r="2.6" fill="#3a2a22"/>
        <circle cx="28.4" cy="11.8" r="2.6" fill="#3a2a22"/>
        <circle cx="42.0" cy="22.0" r="13.8" fill="#e2c9a3" stroke="#b0894f" stroke-width="1.6"/>
        <path d="M41.48 20.49 L41.60 20.43 L41.73 20.39 L41.86 20.36 L42.00 20.33 L42.13 20.32 L42.27 20.32 L42.41 20.33 L42.55 20.35 L42.69 20.39 L42.83 20.43 L42.97 20.49 L43.10 20.56 L43.22 20.64 L43.34 20.73 L43.46 20.83 L43.56 20.95 L43.66 21.07 L43.75 21.20 L43.83 21.34 L43.90 21.48 L43.95 21.64 L44.00 21.79 L44.03 21.96 L44.05 22.12 L44.05 22.29 L44.04 22.46 L44.02 22.64 L43.98 22.81 L43.93 22.97 L43.86 23.14 L43.78 23.30 L43.68 23.46 L43.57 23.61 L43.45 23.75 L43.32 23.88 L43.17 24.00 L43.02 24.11 L42.85 24.21 L42.67 24.30 L42.49 24.37 L42.30 24.42 L42.10 24.47 L41.90 24.49 L41.69 24.50 L41.48 24.49 L41.27 24.47 L41.06 24.42 L40.86 24.36 L40.66 24.29 L40.46 24.19 L40.27 24.08 L40.08 23.95 L39.91 23.81 L39.74 23.65 L39.59 23.47 L39.45 23.28 L39.33 23.08 L39.22 22.87 L39.13 22.65 L39.06 22.42 L39.00 22.18 L38.97 21.93 L38.95 21.68 L38.96 21.43 L38.98 21.17 L39.03 20.92 L39.10 20.67 L39.19 20.42 L39.30 20.17 L39.43 19.94 L39.58 19.71 L39.75 19.50 L39.94 19.29 L40.15 19.11 L40.38 18.93 L40.62 18.78 L40.88 18.64 L41.15 18.53 L41.43 18.43 L41.72 18.36 L42.01 18.31 L42.32 18.28 L42.63 18.28 L42.94 18.31 L43.25 18.36 L43.56 18.44 L43.86 18.54 L44.16 18.67 L44.45 18.83 L44.73 19.01 L44.99 19.21 L45.24 19.44 L45.48 19.69 L45.69 19.96 L45.89 20.25 L46.06 20.56 L46.21 20.88 L46.33 21.22 L46.42 21.57 L46.49 21.93 L46.53 22.30 L46.53 22.68 L46.51 23.06 L46.45 23.43 L46.37 23.81 L46.25 24.18 L46.10 24.55 L45.92 24.91 L45.70 25.25 L45.46 25.58 L45.19 25.89 L44.89 26.18 L44.57 26.45 L44.22 26.69 L43.85 26.90 L43.46 27.09 L43.05 27.25 L42.62 27.37 L42.19 27.46 L41.74 27.51 L41.28 27.53 L40.82 27.51 L40.36 27.45 L39.90 27.35 L39.44 27.22 L38.99 27.04 L38.56 26.83 L38.13 26.58 L37.73 26.29 L37.34 25.97 L36.98 25.61 L36.65 25.23 L36.35 24.81 L36.08 24.36 L35.84 23.89 L35.64 23.40 L35.48 22.88 L35.36 22.35 L35.29 21.81 L35.26 21.25 L35.27 20.69 L35.33 20.13 L35.44 19.56 L35.60 19.01 L35.80 18.46 L36.05 17.92 L36.34 17.40 L36.68 16.90 L37.06 16.43 L37.49 15.98 L37.95 15.57 L38.45       </svg>
    </main>

    <footer>
      <p class="memory">In loving memory</p>
    </footer>


    <script>
      /* The crab scurries out into the gutter and back. Every third or fourth
         lap - picked fresh each time - it throws in a backflip. Script-driven
         because "a random lap" is not something CSS keyframes can say. */
      (function () {
        var crab = document.querySelector('.crab');
        var card = document.querySelector('.card');
        if (!crab || !card || !crab.animate) return;

        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
        var running = false;

        /* Untransformed geometry. Note an SVG element has no offsetLeft or
           offsetWidth - those are HTMLElement properties - and a bounding rect
           would include the transform we are mid-way through applying. So the
           resting box is derived from computed style against the card. */
        function metrics() {
          var cr = card.getBoundingClientRect(), cs = getComputedStyle(crab);
          var w = parseFloat(cs.width) || 0, h = parseFloat(cs.height) || 0;
          var left = cs.left !== 'auto'
            ? cr.left + (parseFloat(cs.left) || 0) + (parseFloat(cs.marginLeft) || 0)
            : cr.right - (parseFloat(cs.right) || 0) - w;
          return { left: left, w: w, h: h };
        }
        function gutter(m) {
          return Math.max(0, window.innerWidth - m.left - m.w - 12);
        }
        function rnd(a, b) { return a + Math.random() * (b - a); }
        function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
        function tf(x, y, dir, rot) {
          return 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)'
               + ' rotate(' + rot.toFixed(1) + 'deg) scaleX(' + dir + ')';
        }
        function play(frames, ms, easing) {
          return crab.animate(frames, {
            duration: ms, easing: easing || 'ease-in-out', fill: 'forwards'
          }).finished.catch(function () {});
        }
        /* Turning has to be instant - tweening scaleX would squash it through zero. */
        function face(x, dir) {
          return play([{ transform: tf(x, 0, dir, 0) }, { transform: tf(x, 0, dir, 0) }], 1);
        }

        async function loop() {
          var dir = 1;                              /* 1 = facing left, as drawn */
          var laps = 0, target = 3 + Math.round(Math.random());

          while (running) {
            if (document.hidden) { await wait(600); continue; }

            var m = metrics(), R = gutter(m);
            if (!(R >= 24)) { await wait(1200); continue; }  /* no room to run */
            var bob = m.w * 0.07;

            for (var leg = 0; leg < 2 && running; leg++) {
              var out = leg === 0;
              var from = out ? 0 : R, to = out ? R : 0, d = out ? -1 : 1;
              if (d !== dir) { await face(from, d); dir = d; }
              var span = to - from;
              await play([
                { transform: tf(from, 0, d, 0) },
                { transform: tf(from + span * 0.25, -bob, d, 0) },
                { transform: tf(from + span * 0.5, 0, d, 0) },
                { transform: tf(from + span * 0.75, -bob, d, 0) },
                { transform: tf(to, 0, d, 0) }
              ], Math.min(2200, Math.max(800, R * 6.4)));
              await wait(rnd(250, 1000));
            }

            if (++laps >= target) {
              laps = 0;
              target = 3 + Math.round(Math.random());
              var turn = 360 * dir;                 /* backwards, over the shell */
              var hop = metrics().h * 0.3;   /* just a slight bump off the sand */
              await play([
                { transform: tf(0, 0, dir, 0) },
                { transform: tf(0, -hop, dir, turn / 2), offset: 0.5 },
                { transform: tf(0, 0, dir, turn) }
              ], 1440, 'cubic-bezier(.34,.01,.53,1)');
              await face(0, dir);                   /* 360 deg back to a clean base */
              await wait(rnd(600, 1600));
            }
          }
        }

        function start() {
          if (reduce.matches || running) return;
          running = true;
          crab.style.animation = 'none';  /* release the entry animation's hold */
          loop();
        }
        function stop() {
          running = false;
          crab.getAnimations().forEach(function (a) { a.cancel(); });
          crab.style.transform = '';
        }

        reduce.addEventListener('change', function () { reduce.matches ? stop() : start(); });
        setTimeout(start, 2100);          /* let the entry rise settle first */
      })();
    </script>
  </body>
</html>
