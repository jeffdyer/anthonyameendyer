<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony Ameen Dyer</title>
    <meta name="description" content="In memory of Anthony Ameen Dyer, December 8, 1969 &ndash; May 5, 2026.">

    <meta property="og:title" content="Anthony Ameen Dyer">
    <meta property="og:description" content="December 8, 1969 &ndash; May 5, 2026">
    <meta property="og:type" content="website">
    <meta property="og:image" content="tony-memorial.png">

    <link rel="icon" href="data:,">
    <style>
      :root {
        /* Sampled from the water just outside the shore break in Tony's photo:
           #47a2b0 deeper, #87bfc1 sandy turquoise, #9ac9c9 where sand lightens
           it. Deeper up top, paling toward the bottom, as water does to shore. */
        --bg-top: #6fb3bb;
        --bg-bottom: #a9d1d0;
        --ink: #204e57;
        --shadow: 18, 66, 74;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        min-height: 100vh;
        min-height: 100dvh; /* accounts for mobile browser chrome */
        padding: 2.5rem 1.25rem;
        /* An abstract shore break: a band of denser foam thinning to nothing
           above and below, repeating horizontally only. It sits behind the
           card, so the texture reads around the photo, never over it. */
        background-image: url('foam.png'),
                          linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
        background-repeat: repeat-x, no-repeat;
        background-position: center 72%, center;
        color: var(--ink);
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        max-width: min(440px, 100%);
        max-height: 82vh;
        width: auto;
        height: auto;
        border-radius: 4px;
        box-shadow:
          0 1px 2px rgba(var(--shadow), 0.12),
          0 18px 48px rgba(var(--shadow), 0.28);
        animation: rise 1.4s ease-out both;
      }

      footer {
        font-size: 1.25rem;
        letter-spacing: 0.06em;
        text-align: center;
        line-height: 1.7;
        opacity: 0.85;
        animation: rise 1.4s ease-out 0.35s both;
      }

      footer a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .card, footer { animation: none; }
      }
    </style>
  </head>
  <body>
    <img class="card" src="tony-memorial.png"
         alt="Anthony Ameen Dyer, December 8, 1969 to May 5, 2026. A life is measured in the love shared, the laughter remembered, and the lives made better along the way.">

    <footer>
      In loving memory
    </footer>
  </body>
</html>
